[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tubiblia"
version = "0.1.0"
description = "Lector bíblico local para escritorio (Linux y Windows)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [{ name = "CunaWare.Lab", email = "taculberrypitman@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8", "pocket-tts>=1.0"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6.15", "Pillow>=10"]

[project.scripts]
tubiblia = "tubiblia.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tubiblia*"]

[tool.setuptools.package-data]
tubiblia = ["assets/*.jpg", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
